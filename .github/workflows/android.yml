name: Android M1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Test the scan guard
        run: scripts/test-check-no-scans.sh
      - name: No scans in the tree
        run: scripts/check-no-scans.sh
      - name: No scans in any commit of this push/PR
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            scripts/check-no-scans.sh --range "$PR_BASE..$PR_HEAD"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch (or force push over unknown history): everything not on main.
            scripts/check-no-scans.sh --range "$GITHUB_SHA" --not origin/main
          else
            scripts/check-no-scans.sh --range "$BEFORE..$GITHUB_SHA"
          fi
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: skillit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            adb pull /sdcard/Android/data/fi.skillit/files/notation app/build/reports/notation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/
